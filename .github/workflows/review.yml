# The review, as one referenced step.
#
# A repository that wants the panel adds a few lines calling this workflow.
# It does NOT get a copy of the lens set, the prompts or the runner — that
# duplication is the defect this story exists to remove, and a vendored copy
# looks harmless for about a month before the copies start disagreeing about
# what the bar is.
#
# The definition and the runner arrive together, from one checkout at one ref.
# What that makes impossible is worth stating precisely, because an earlier
# version of this comment overclaimed: within a run, a runner from one
# revision cannot read a lens set from another. BETWEEN runs both halves
# float, because `governance-ref` defaults to `main` — which is deliberate,
# and is how a fix reaches every repository at once.
name: review

on:
  workflow_call:
    inputs:
      governance-ref:
        description: >-
          Which revision of the reviewer to run. Defaults to main, so a fix to
          the lens set or the runner reaches every repository at once — which
          is the point of there being one home.
        type: string
        required: false
        default: main
      model:
        description: >-
          Override the pinned judge. Leave this alone unless you know why you
          are changing it: the same commit judged by two models is two
          verdicts, and a judge that varies between repositories is a bar that
          moved without anyone deciding to move it. Blank means the pinned
          default, which is declared once in settings.ts and deliberately not
          repeated here.
        type: string
        required: false
        default: ''
    secrets:
      anthropic-api-key:
        description: The key the panel calls with. One model call per lens.
        required: true
      governance-token:
        description: >-
          Read access to verevoir/aigency-governance, which is private. The
          default GITHUB_TOKEN is scoped to the repository that triggered the
          run — yours — so it cannot see the reviewer, and a run without this
          fails at the checkout with "Repository not found". A fine-grained
          token with contents:read on that one repository is enough.
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Stated rather than inherited. Without this the job takes the calling
    # repository's default, which on older organisations is write-all — and
    # this job checks out contributor-authored code and hands a
    # contributor-authored title to a process. It also serves as the statement
    # that no pull-request write permission is being taken.
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 is load-bearing, and the single most likely line here
      # to be "tidied up" by someone speeding up CI.
      #
      # The failure it prevents is not the one you might expect, and the
      # earlier version of this comment had it wrong. With the default depth,
      # checkout fetches only refs/pull/N/merge and never creates
      # refs/remotes/origin/<base> at all — so the diff step does not produce
      # an empty diff to be caught downstream, it dies with "ambiguous
      # argument: unknown revision". Red immediately, which is the better
      # outcome, and the runner's empty-diff guard never sees it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every value that reaches a shell goes through the environment rather
      # than through `${{ }}`, because that expansion happens before the shell
      # sees it: a value containing $(...) executes. A branch name is a less
      # likely carrier than a title, and the rule is not worth having two
      # versions of.
      - name: Work out what changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Only a pull request has a base to diff against. On a push or a
          # merge group this is empty, `origin/` is a malformed ref, and git
          # fails with a message about revisions — which sends the reader to
          # look at their repository when the answer is that this workflow
          # only means anything on a pull request. Say that instead.
          if [ -z "${BASE_REF}" ]; then
            echo "No base ref. This workflow reviews a pull request against its base," >&2
            echo "and the event that triggered it has no base — so there is nothing to" >&2
            echo "compare. Call it from an 'on: pull_request' workflow." >&2
            exit 1
          fi
          # On a pull_request event HEAD is the merge commit, whose first
          # parent is the base tip — so --merge-base resolves to that tip and
          # the diff is exactly the change, carrying no base-only commits. It
          # stays correct if the base advances afterwards, and if the branch
          # has merged the base into itself.
          #
          # `fetch-depth: 2` with `git diff HEAD^1 HEAD` is the cheaper
          # equivalent, because HEAD^1 IS the base tip. It is deliberately not
          # used: it becomes silently wrong the moment someone checks out
          # pull_request.head.sha instead of the merge ref, where --merge-base
          # stays right. The full clone buys a form that cannot be quietly
          # broken, and the next person to find HEAD^1 should know it was
          # considered.
          git diff --merge-base "origin/${BASE_REF}" HEAD > "${RUNNER_TEMP}/review.diff"

      - name: Fetch the reviewer and the definition together
        uses: actions/checkout@v4
        with:
          repository: verevoir/aigency-governance
          ref: ${{ inputs.governance-ref }}
          token: ${{ secrets.governance-token }}
          path: .aigency-review

      # No `cache: npm`, and that is a decision rather than an oversight. The
      # cache keys off a lockfile at the workspace root, which is the CALLING
      # repository's and not the reviewer's — so it would cache the wrong
      # lockfile. It looks like an obvious speed-up and is not one.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the reviewer
        working-directory: .aigency-review
        run: |
          npm ci
          npm run build

      # Three things in this step are less obvious than they look.
      #
      # The title is contributor-controlled on any repository taking outside
      # pull requests, so it reaches the process as an argument through the
      # environment and never as shell text. The `:-` default is needed
      # because the runner's own fallback is nullish — an empty title is a
      # string, so it passes straight through and heads the report with
      # nothing.
      #
      # The lens path is absolute. Relative worked only because this step
      # happens not to set working-directory while the one above does, and two
      # adjacent steps with different working directories is exactly what an
      # edit breaks.
      #
      # continue-on-error, with the verdict taken again below: the report must
      # be published whether the review passed or failed, and publishing must
      # not be able to change the verdict.
      - name: Review
        id: review
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          AIGENCY_REVIEW_LENSES: ${{ github.workspace }}/.aigency-review/review/lenses.json
          AIGENCY_REVIEW_MODEL: ${{ inputs.model }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          node .aigency-review/dist/cli/review.js "${PR_TITLE:-this change}" \
            < "${RUNNER_TEMP}/review.diff" \
            | tee "${RUNNER_TEMP}/review.md"

      # Not always(): that also runs on cancellation, and if an earlier step
      # failed the report was never written — cat would fail with "No such
      # file", landing a confusing red step after the real one and burying it.
      - name: Publish the report
        if: success() || failure()
        run: |
          if [ -f "${RUNNER_TEMP}/review.md" ]; then
            cat "${RUNNER_TEMP}/review.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "The review produced no report: it failed before writing one." >> "${GITHUB_STEP_SUMMARY}"
            echo "The failing step above says why." >> "${GITHUB_STEP_SUMMARY}"
          fi

      # The verdict, taken from the step that produced it. `success` means the
      # binary exited 0, which it does only for an approval — a rejection and
      # a could-not-run are both 1, and both are red.
      #
      # The condition lives in `if:` rather than in the shell, so no `${{ }}`
      # reaches a `run:`. The value is a controlled enum and would not be
      # exploitable; a file that teaches a rule and breaks it on the same
      # screen teaches the wrong thing.
      #
      # `::error` puts the verdict on the pull request's Checks tab with no
      # token and no permission — most of what a comment would buy, for one
      # line. A real comment would need pull-requests: write declared by the
      # CALLER, and would fail on fork pull requests, which are precisely the
      # ones where outside code is being judged.
      - name: Take the verdict
        if: (success() || failure()) && steps.review.outcome != 'success'
        run: |
          echo "::error title=Review::The review did not approve. The report is in the job summary."
          exit 1
