# The review, as one referenced step.
#
# A repository that wants the panel adds a few lines calling this workflow.
# It does NOT get a copy of the lens set, the prompts or the runner.
#
# The runner is the PUBLISHED @verevoir/review `aigency-review` CLI, pinned
# exactly by REVIEWER_PACKAGE below. The lenses are DERIVED from the practices
# in verevoir/aigency-guardrails (corpus/practices), so the bar is the corpus
# and not a second hand-maintained lens file. Callers pin this workflow by
# SHA, so that pin pins the reviewer version for them too; the corpus floats
# with `guardrails-ref` (default main), and its commit is recorded in the job
# summary so a verdict can be traced to the bar it was judged by.
#
# The reviewer is installed OUTSIDE the repository under review, with
# --ignore-scripts, and nothing from the pull request's tree is ever
# installed, built or executed.
name: review

on:
  workflow_call:
    inputs:
      governance-ref:
        description: >-
          Retained for backward compatibility and now UNUSED. The reviewer is
          no longer checked out from governance; it is the published package
          pinned in this workflow. Callers may keep passing it.
        type: string
        required: false
        default: main
      guardrails-ref:
        description: >-
          Which revision of verevoir/aigency-guardrails supplies the practices
          the lenses are derived from. Defaults to main.
        type: string
        required: false
        default: main
      model:
        description: >-
          Override the pinned judge. Leave this alone unless you know why you
          are changing it: the same commit judged by two models is two
          verdicts. Blank means the reviewer's own pinned default.
        type: string
        required: false
        default: ''
    secrets:
      anthropic-api-key:
        description: The key the panel calls with. One model call per lens.
        required: true
      governance-token:
        description: >-
          Reads the private verevoir/aigency-guardrails practices corpus. It
          must have contents:read on aigency-guardrails; the default
          GITHUB_TOKEN cannot do this. Required, as it always has been.
        required: true

env:
  # The one place the reviewer version lives.
  REVIEWER_PACKAGE: '@verevoir/review@0.3.1'

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Stated rather than inherited. checks: read is for listing the head
    # commit's check runs; nothing here writes anything.
    permissions:
      contents: read
      checks: read
    steps:
      # First, before anything expensive: a missing secret is reported by name
      # rather than surfacing later as a generic failure. `required: true`
      # does not enforce a non-blank value.
      - name: Confirm the key is available before doing anything expensive
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          GOVERNANCE_TOKEN: ${{ secrets.governance-token }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error title=Review::ANTHROPIC_API_KEY is not available to this workflow."
            echo "::error title=Review::Pass it under secrets.anthropic-api-key rather than secrets: inherit or nothing at all."
            exit 1
          fi
          # Never echo the value, its length or any prefix of it.
          if [ -z "${GOVERNANCE_TOKEN}" ]; then
            echo "::error title=Review::governance-token is empty. Add GOVERNANCE_TOKEN as a repository secret with contents:read on verevoir/aigency-guardrails. Organization secrets are not passed to private repositories on the GitHub Free plan."
            exit 1
          fi

      # fetch-depth: 0 is load-bearing: without it origin/<base> does not
      # exist and the diff step dies with "unknown revision".
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every github.event value reaches a shell through env:, never through
      # an expression inside run:.
      - name: Work out what changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "${BASE_REF}" ]; then
            echo "No base ref. This workflow reviews a pull request against its base," >&2
            echo "so call it from an 'on: pull_request' workflow." >&2
            exit 1
          fi
          # HEAD is the merge commit on a pull_request event, so --merge-base
          # yields exactly the change.
          git diff --merge-base "origin/${BASE_REF}" HEAD > "${RUNNER_TEMP}/review.diff"

      # The practices the lenses are derived from. Checked out inside the
      # workspace (checkout requires that) but untracked, so it is not in the
      # diff, and it is not a path any PR can supply. Token: governance-token,
      # which needs contents:read on aigency-guardrails (private).
      - name: Fetch the practices corpus
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: verevoir/aigency-guardrails
          ref: ${{ inputs.guardrails-ref }}
          token: ${{ secrets.governance-token }}
          path: .aigency-guardrails
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Outside the repo, no lockfile, no lifecycle scripts. Runs with cwd in
      # RUNNER_TEMP, not the PR checkout, so a PR-supplied .npmrc cannot steer
      # the registry.
      - name: Install the reviewer
        working-directory: ${{ runner.temp }}
        run: |
          npm install --no-save --no-package-lock --ignore-scripts \
            --prefix "${RUNNER_TEMP}/aigency-review" "${REVIEWER_PACKAGE}"

      - name: Record what is judging and against what
        run: |
          corpus_sha="$(git -C "${GITHUB_WORKSPACE}/.aigency-guardrails" rev-parse HEAD)"
          {
            echo "### Review provenance"
            echo ""
            echo "- Reviewer: \`${REVIEWER_PACKAGE}\`"
            echo "- Corpus: \`verevoir/aigency-guardrails@${corpus_sha}\` (\`corpus/practices\`)"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

      # One line per check on the head commit, "name: status/conclusion".
      # The review checks themselves are left out (this workflow's own check,
      # named "review" or "review / review" depending on the caller, and the
      # "Antagonistic review" / "antagonistic-review" checks, and the
      # antagonist's "review (correctness)" style checks): the file is input
      # to a review.
      # Other checks whose names merely contain "review" are kept.
      - name: Collect the other checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --paginate "repos/${REPO}/commits/${HEAD_SHA}/check-runs" \
            --jq '.check_runs[] | select(.name | test("^(review|review / review|antagonistic[- ]review.*|review \\(.*\\))$"; "i") | not) | "\(.name): \(.status)/\(.conclusion // "none")"' \
            > "${RUNNER_TEMP}/checks.txt"
          echo "Omitted deliberately: review checks are not listed here, because this file is input to a review." \
            >> "${RUNNER_TEMP}/checks.txt"
          # Auditable: only check names, statuses and conclusions.
          {
            echo "### Checks given to the reviewer"
            echo ""
            echo '```'
            cat "${RUNNER_TEMP}/checks.txt"
            echo '```'
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

      # continue-on-error, with the verdict taken again below: the report is
      # published whether the review passed or failed, and publishing must not
      # change the verdict. The CLI appends its own report to
      # GITHUB_STEP_SUMMARY, so nothing re-appends it.
      - name: Review
        id: review
        continue-on-error: true
        # cwd outside the PR checkout; every path below is absolute.
        working-directory: ${{ runner.temp }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          AIGENCY_REVIEW_MODEL: ${{ inputs.model }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -o pipefail
          args=(--practices "${GITHUB_WORKSPACE}/.aigency-guardrails/corpus/practices"
                --context-root "${GITHUB_WORKSPACE}"
                --checks-file "${RUNNER_TEMP}/checks.txt")
          if [ -n "${PR_TITLE}" ]; then args+=(--title "${PR_TITLE}"); fi
          if [ -n "${PR_BODY//[[:space:]]/}" ]; then
            printf '%s\n' "${PR_BODY}" > "${RUNNER_TEMP}/description.md"
            args+=(--description-file "${RUNNER_TEMP}/description.md")
          fi
          "${RUNNER_TEMP}/aigency-review/node_modules/.bin/aigency-review" "${args[@]}" \
            < "${RUNNER_TEMP}/review.diff" \
            | tee "${RUNNER_TEMP}/review.md"

      # The CLI already wrote the report to the summary. This only covers a
      # failure before any report existed. tee creates review.md even when the
      # CLI crashes, so "no report" means an EMPTY file (-s), not a missing one.
      - name: Note a missing report
        if: success() || failure()
        run: |
          if [ ! -s "${RUNNER_TEMP}/review.md" ]; then
            echo "The review produced no report: it failed before writing one." >> "${GITHUB_STEP_SUMMARY}"
            echo "The failing step above says why." >> "${GITHUB_STEP_SUMMARY}"
          fi

      # Green only when the CLI exited 0 (approved, or nothing in scope). A
      # rejection and a could-not-run both exit 1. `== 'failure'` rather than
      # `!= 'success'`: a skipped Review has outcome '' and must not be
      # reported as "did not approve".
      - name: Take the verdict
        if: (success() || failure()) && steps.review.outcome == 'failure'
        run: |
          if [ ! -s "${RUNNER_TEMP}/review.md" ] || grep -q '^## Review: Could not run' "${RUNNER_TEMP}/review.md"; then
            echo "::error title=Review::The review could not run — nothing was reviewed. The report says why, in the job summary."
          else
            echo "::error title=Review::The review did not approve. The report is in the job summary."
          fi
          exit 1
