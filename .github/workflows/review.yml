# The review, as one referenced step.
#
# A repository that wants the panel adds a few lines calling this workflow.
# It does NOT get a copy of the lens set, the prompts or the runner — that
# duplication is the defect this story exists to remove, and a vendored copy
# looks harmless for about a month before the copies start disagreeing about
# what the bar is.
#
# The definition and the runner arrive together, from one checkout at one ref.
# What that makes impossible is worth stating precisely, because an earlier
# version of this comment overclaimed: within a run, a runner from one
# revision cannot read a lens set from another. BETWEEN runs both halves
# float, because `governance-ref` defaults to `main` — which is deliberate,
# and is how a fix reaches every repository at once.

name: review

on:
  workflow_call:
    inputs:
      governance-ref:
        description: >-
          Which revision of the reviewer to run. Defaults to main, so a fix to
          the lens set or the runner reaches every repository at once — which
          is the point of there being one home.
        type: string
        required: false
        default: main
      model:
        description: >-
          Override the pinned judge. Leave this alone unless you know why you
          are changing it: the same commit judged by two models is two
          verdicts, and a judge that varies between repositories is a bar that
          moved without anyone deciding to move it. Blank means the pinned
          default, which is declared once in settings.ts and deliberately not
          repeated here.
        type: string
        required: false
        default: ''
    secrets:
      anthropic-api-key:
        description: The key the panel calls with. One model call per lens.
        required: true
      governance-token:
        description: >-
          Read access to verevoir/aigency-governance, which is private. The
          default GITHUB_TOKEN is scoped to the repository that triggered the
          run — yours — so it cannot see the reviewer, and a run without this
          fails at the checkout with "Repository not found". A fine-grained
          token with contents:read on that one repository is enough.
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Stated rather than inherited. Without this the job takes the calling
    # repository's default, which on older organisations is write-all — and
    # this job checks out contributor-authored code and hands a
    # contributor-authored title to a process. It also serves as the statement
    # that no pull-request write permission is being taken.
    permissions:
      contents: read
    steps:
      # Runs before anything else in this job: no checkout, no npm ci, no
      # build. A review found that a missing ANTHROPIC_API_KEY was only ever
      # discovered after all of that had already run, behind the exact
      # "review did not approve" ambiguity the Checks-tab step below exists
      # to prevent — a red check with no legible reason short of reading the
      # Actions log directly. This step costs nothing (no network, no
      # process) and fails immediately, naming the missing secret, rather
      # than letting the absence surface three steps and several minutes
      # later as a generic build-and-review failure.
      #
      # Checks only anthropic-api-key, deliberately. `required: true` on a
      # workflow_call secret enforces that the CALLER's `secrets:` mapping
      # names the key — it does not enforce that the value is non-blank, and
      # `${{ secrets.X }}` for a secret that does not exist on the calling
      # repository evaluates to the empty string, which satisfies
      # `required: true` and arrives here blank. governance-token's failure
      # mode is already distinct and already legible on its own — a missing
      # or wrong value fails the very next step, the governance checkout,
      # with GitHub's own "Repository not found", which is unambiguous
      # without needing this pattern repeated for it.
      - name: Confirm the key is available before doing anything expensive
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error title=Review::ANTHROPIC_API_KEY is not available to this workflow." 
            echo "::error title=Review::Check that the repository (or organisation) running" 
            echo "::error title=Review::this job has an ANTHROPIC_API_KEY secret configured," 
            echo "::error title=Review::and that whatever calls this reusable workflow passes" 
            echo "::error title=Review::it under secrets.anthropic-api-key rather than" 
            echo "::error title=Review::secrets: inherit or nothing at all." 
            exit 1
          fi

      # fetch-depth: 0 is load-bearing, and the single most likely line here
      # to be "tidied up" by someone speeding up CI.
      #
      # The failure it prevents is not the one you might expect, and the
      # earlier version of this comment had it wrong. With the default depth,
      # checkout fetches only refs/pull/N/merge and never creates
      # refs/remotes/origin/<base> at all — so the diff step does not produce
      # an empty diff to be caught downstream, it dies with "ambiguous
      # argument: unknown revision". Red immediately, which is the better
      # outcome, and the runner's empty-diff guard never sees it.
      #
      # persist-credentials: false here as well. The reason is weaker than on
      # the governance checkout — this token is the caller's own, short-lived
      # and scoped to the repository being reviewed — but `npm ci` runs in a
      # subdirectory of this workspace, so a postinstall script can read
      # <workspace>/.git/config either way. Nothing pushes from here, so the
      # credential has no work to do after the clone, and leaving it costs
      # nothing to remove.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every value that reaches a shell goes through the environment rather
      # than through `${{ }}`, because that expansion happens before the shell
      # sees it: a value containing $(...) executes. A branch name is a less
      # likely carrier than a title, and the rule is not worth having two
      # versions of.
      - name: Work out what changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Only a pull request has a base to diff against. On a push or a
          # merge group this is empty, `origin/` is a malformed ref, and git
          # fails with a message about revisions — which sends the reader to
          # look at their repository when the answer is that this workflow
          # only means anything on a pull request. Say that instead.
          if [ -z "${BASE_REF}" ]; then
            echo "No base ref. This workflow reviews a pull request against its base," >&2
            echo "and the event that triggered it has no base — so there is nothing to" >&2
            echo "compare. Call it from an 'on: pull_request' workflow." >&2
            exit 1
          fi
          # On a pull_request event HEAD is the merge commit, whose first
          # parent is the base tip — so --merge-base resolves to that tip and
          # the diff is exactly the change, carrying no base-only commits. It
          # stays correct if the base advances afterwards, and if the branch
          # has merged the base into itself.
          #
          # `fetch-depth: 2` with `git diff HEAD^1 HEAD` is the cheaper
          # equivalent, because HEAD^1 IS the base tip. It is deliberately not
          # used: it becomes silently wrong the moment someone checks out
          # pull_request.head.sha instead of the merge ref, where --merge-base
          # stays right. The full clone buys a form that cannot be quietly
          # broken, and the next person to find HEAD^1 should know it was
          # considered.
          git diff --merge-base "origin/${BASE_REF}" HEAD > "${RUNNER_TEMP}/review.diff"

      # persist-credentials: false, and it matters more here than it usually
      # does. Left at its default, checkout writes this token into
      # .aigency-review/.git/config as a header credential — and the next step
      # runs `npm ci` in that same directory, so any postinstall script in the
      # dependency tree can read it. That was survivable when this was the
      # ambient GITHUB_TOKEN: scoped to the calling repository, expiring with
      # the job. It is not survivable for a long-lived cross-repository token,
      # which is what fixing the previous defect turned it into. Nothing here
      # pushes, so the credential has no work to do after the clone.
      - name: Fetch the reviewer and the definition together
        uses: actions/checkout@v4
        with:
          repository: verevoir/aigency-governance
          ref: ${{ inputs.governance-ref }}
          token: ${{ secrets.governance-token }}
          path: .aigency-review
          persist-credentials: false

      # `governance-ref` is what was ASKED for — `main`, a pin, a PR's own
      # head sha for self-review — and it can float between runs. This
      # records what was actually resolved: the real commit the checkout
      # above landed on. Kept apart from the input deliberately (see the
      # review artefact below): a verdict is a function of two shas, this
      # repository's own head and the governance commit that judged it, and
      # only the first has ever been visible on a report. If `governance-ref`
      # ever resolves differently between two runs, that is real information
      # and this is what would show it.
      - name: Record which governance commit was actually checked out
        id: governance-sha
        working-directory: .aigency-review
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # No `cache: npm`, and it is a choice rather than an impossibility — an
      # earlier comment here said the latter, which was wrong. `setup-node`
      # takes `cache-dependency-path`, and this step runs after the governance
      # checkout, so pointing it at .aigency-review/package-lock.json would
      # cache the right lockfile. It is left off because the key would then be
      # a lockfile from a ref that floats with main, cached per consumer
      # repository — a cache that is sometimes stale in a way nobody can see
      # from either repository. Left as a deliberate cost, not an oversight.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the reviewer
        working-directory: .aigency-review
        run: |
          npm ci
          npm run build

      # Three things in this step are less obvious than they look.
      #
      # The title is contributor-controlled on any repository taking outside
      # pull requests, so it reaches the process as an argument through the
      # environment and never as shell text. The `:-` default is needed
      # because the runner's own fallback is nullish — an empty title is a
      # string, so it passes straight through and heads the report with
      # nothing. Note that this is now the second fallback for an empty title,
      # the first being the runner's own. They can drift, and only one of them
      # is covered by a test.
      #
      # Both paths are absolute — the lens set and the entrypoint. An earlier
      # version absolutised only the first while claiming the step was
      # defended against someone adding a working-directory, which would still
      # have broken the second. Half a fix under a comment describing a whole
      # one is worse than neither.
      # Through GITHUB_WORKSPACE rather than ${{ github.workspace }}, which is
      # the same value by the sanctioned route. The first attempt at this fix
      # used the expression form and put a ${{ }} back into a run: — not
      # exploitable, since the runner supplies that value, but the argument
      # against it was never that it was exploitable. It was that a file
      # teaching a rule and breaking it on the same screen teaches the wrong
      # thing. The env: line above keeps the expression form, correctly:
      # env: is not a shell context, and that is the pattern this file argues
      # for rather than against.
      #
      # continue-on-error, with the verdict taken again below: the report must
      # be published whether the review passed or failed, and publishing must
      # not be able to change the verdict.
      - name: Review
        id: review
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          AIGENCY_REVIEW_LENSES: ${{ github.workspace }}/.aigency-review/review/lenses.json
          AIGENCY_REVIEW_MODEL: ${{ inputs.model }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          node "${GITHUB_WORKSPACE}/.aigency-review/dist/cli/review.js" "${PR_TITLE:-this change}" \
            < "${RUNNER_TEMP}/review.diff" \
            | tee "${RUNNER_TEMP}/review.md"

      # Not always(): that also runs on cancellation, and if an earlier step
      # failed the report was never written — cat would fail with "No such
      # file", landing a confusing red step after the real one and burying it.
      - name: Publish the report
        if: success() || failure()
        run: |
          if [ -f "${RUNNER_TEMP}/review.md" ]; then
            cat "${RUNNER_TEMP}/review.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "The review produced no report: it failed before writing one." >> "${GITHUB_STEP_SUMMARY}"
            echo "The failing step above says why." >> "${GITHUB_STEP_SUMMARY}"
          fi

      # Every review runs, is read once from the step summary, and is gone —
      # there is no REST API for a step summary, and until now no artefact
      # either. This is the fix: the same content that went to the step
      # summary above, kept, so twenty ordinary pull requests become twenty
      # retained data points instead of twenty discarded ones. This step
      # changes nothing about what the review DOES — no lens, no contract, no
      # rendering — only what is kept afterwards.
      #
      # `if: success() || failure()`, the same guard as Publish the report,
      # deliberately: a review that failed or could not run is exactly the
      # case where the retained record is most valuable, and an artefact that
      # only survived on success would keep the least interesting half.
      #
      # Raw `reportMarkdown`, not re-parsed fields. The structured verdict and
      # findings already exist once, inside report.ts's own render; re-deriving
      # `lens`/`summary` from the rendered text in shell here would be a
      # second, parallel, drift-prone format of the same data — the exact
      # thing a fresh artefact format must not become. Keeping the text whole
      # preserves it without duplicating it.
      #
      # Two properties below are not incidental — recovering PR #5's own nine
      # review passes (eval/pr5-review-history-recovered.md) hit both walls
      # directly, and this design is the answer to each:
      #
      # 1. Retrieval here is by artefact name, tied to this run — never by
      #    "the pull request's most recently matched check run", which is the
      #    only retrieval `read_pull_request_review` offers. That single-slot
      #    limit is why 8 of PR #5's 9 passes have no recoverable verbatim
      #    text today: nothing captured them before a later pass aged them out
      #    of that one slot. An artefact per run has no slot to age out of —
      #    every run's own record survives independently of what ran after it.
      #
      # 2. `reportMarkdown` below is read from the file the Review step wrote
      #    directly via `tee`, never from a job log. That distinction is not
      #    pedantry: recovering PR #5's ninth pass from its job log surfaced a
      #    finding's own prose rendered as `authorization: ***` — GitHub's
      #    log-stream secret masking, which rewrites whatever the captured log
      #    TEXT contains and has no effect on a file the same step also wrote
      #    to disk. Reading the file, not the log, is what keeps this artefact
      #    out of reach of that layer.
      #
      # A third property, added here: `outcome`. Until this, `reportMarkdown:
      # null` meant three different things with nothing else in the artefact
      # to tell them apart — the Review step never got reached because
      # something before it failed; it was reached and wrote nothing before
      # finishing or dying; or it wrote something and this step lost it. That
      # is the exact defect this whole persistence mechanism exists to fight,
      # sitting inside the mechanism itself — found by this branch's own
      # review (PR #11), which is the correct way for it to have been found.
      # `outcome` now always names which happened:
      #
      #   - `approved` / `rejected` / `could_not_run` / `out_of_scope` — the
      #     panel ran and wrote a report. The word is read off the report's
      #     own first line — report.ts's existing HEADING vocabulary — the
      #     same way "Take the verdict" below already reads that line rather
      #     than re-deriving the outcome; this is not a parallel set of words
      #     invented for the artefact.
      #   - `empty_report` — the Review step ran (its `tee` opened
      #     `review.md`) but the file holds nothing: the process finished or
      #     died before writing a byte.
      #   - `not_reached` — `review.md` does not exist at all. `tee`
      #     truncates-and-creates its output file the instant that step's
      #     shell runs, before the process it wraps writes anything — so a
      #     wholly missing file means the Review step's body never executed.
      #     With no `if: always()` on any step here, that happens only when
      #     something earlier in the job (the key check, either checkout, the
      #     build) already failed and this step was skipped in consequence.
      #     "The panel never ran" and "a step failed before it could" are the
      #     same fact seen from two ends, not two states this shell can tell
      #     apart — so they share one value rather than being given a false
      #     distinction.
      #
      # Named plainly rather than implied: nothing in this repository reads
      # `outcome` back yet. Recording it removes a collapse from the
      # artefact — not nothing — but the loop this artefact exists to close
      # is not closed until something consumes the field, and that is not
      # claimed here.
      - name: Assemble the review artefact
        if: success() || failure()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GOVERNANCE_REF: ${{ inputs.governance-ref }}
          GOVERNANCE_SHA: ${{ steps.governance-sha.outputs.sha }}
          MODEL: ${{ inputs.model }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p "${RUNNER_TEMP}/review-artifact"
          REPORT_PATH="${RUNNER_TEMP}/review.md"
          if [ -s "${REPORT_PATH}" ]; then
            # Present and non-empty: read the outcome off the report's own
            # heading rather than re-deriving it — see the comment above
            # this step.
            REPORT_FILE="${REPORT_PATH}"
            HEADING_LINE="$(head -n 1 "${REPORT_PATH}")"
            case "${HEADING_LINE}" in
              "## Review: Approved") OUTCOME="approved" ;;
              "## Review: Rejected") OUTCOME="rejected" ;;
              "## Review: Could not run") OUTCOME="could_not_run" ;;
              "## Review: Nothing in scope") OUTCOME="out_of_scope" ;;
              *)
                # Content exists but does not open with a heading this step
                # recognises. Named rather than guessed at: a value nothing
                # here can classify must not silently become one of the ones
                # it can.
                OUTCOME="unrecognised_report"
                ;;
            esac
          elif [ -f "${REPORT_PATH}" ]; then
            # Present but empty: the Review step ran — its tee opened this
            # file — but nothing was written before it finished or died.
            REPORT_FILE=/dev/null
            OUTCOME="empty_report"
          else
            # Absent: the Review step's body never executed at all (see the
            # comment above this step for why that is the only way this
            # happens).
            REPORT_FILE=/dev/null
            OUTCOME="not_reached"
          fi
          # `substrate` is a HARDCODED STRING, not a measured value — stated
          # here so a reader can see that it is hardcoded rather than mistake
          # it for something this step computed. It names the only substrate
          # this codebase's production request path actually has today
          # (src/review/anthropic.ts, an API key over HTTP). When a second
          # substrate exists (e.g. a `claude -p` run), this line must become
          # something this step actually observes — an unchanged value at
          # that point would silently misreport which substrate ran.
          #
          # `credentialPath` is the same discipline applied to a different
          # question: not HOW the call was transported, but WHICH credential
          # authorised it. Confirmed by direct grep of this repository's own
          # main (zero CLAUDE_CODE_OAUTH_TOKEN references anywhere, 90+
          # ANTHROPIC_API_KEY references spanning both workflows, settings.ts,
          # the tests and README): today there is exactly one credential path
          # in this codebase, so the honest value IS a constant, and it is
          # written as one rather than dressed up as measured. A
          # `local-review-via-claude-cli` runner already exists on another
          # branch — the moment CI can run through it instead, this line must
          # become an observed value or every record written before that
          # point becomes indistinguishable from one written after it.
          jq -n \
            --arg headSha "$HEAD_SHA" \
            --arg governanceRef "$GOVERNANCE_REF" \
            --arg governanceSha "${GOVERNANCE_SHA:-}" \
            --arg model "${MODEL:-}" \
            --arg substrate "api-key via src/review/anthropic.ts, called over HTTP from this workflow — hardcoded, not measured; see the comment above this step" \
            --arg credentialPath "ANTHROPIC_API_KEY (metered key), via secrets.anthropic-api-key — hardcoded, not measured; this workflow has exactly one credential path today, see the comment above this step" \
            --arg subject "${PR_TITLE:-this change}" \
            --arg repository "$REPOSITORY" \
            --arg runId "$RUN_ID" \
            --arg eventName "$EVENT_NAME" \
            --arg outcome "$OUTCOME" \
            --rawfile reportMarkdown "$REPORT_FILE" \
            '{
              headSha: $headSha,
              governanceRef: $governanceRef,
              governanceSha: ($governanceSha | if . == "" then null else . end),
              model: ($model | if . == "" then null else . end),
              substrate: $substrate,
              credentialPath: $credentialPath,
              subject: $subject,
              repository: $repository,
              runId: $runId,
              eventName: $eventName,
              outcome: $outcome,
              reportMarkdown: (if $reportMarkdown == "" then null else $reportMarkdown end)
            }' > "${RUNNER_TEMP}/review-artifact/review.json"

      # 90 days is GitHub's own platform default for `upload-artifact`, kept
      # rather than overridden — a number someone picked invites someone
      # else to change it without knowing why the pick was right; the
      # platform default does not. This step costs nothing to run: artefact
      # storage is not the constrained budget (model-call spend is).
      - name: Publish the review artefact
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: review-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/review-artifact/review.json
          if-no-files-found: warn

      # The verdict, taken from the step that produced it. `success` means the
      # binary exited 0, which it does only for an approval — a rejection and
      # a could-not-run are both 1, and both are red.
      #
      # The condition lives in `if:` rather than in the shell, so no `${{ }}`
      # reaches a `run:`. The value is a controlled enum and would not be
      # exploitable; a file that teaches a rule and breaks it on the same
      # screen teaches the wrong thing.
      #
      # `::error` puts the verdict on the pull request's Checks tab with no
      # token and no permission — most of what a comment would buy, for one
      # line. A real comment would need pull-requests: write declared by the
      # CALLER, and would fail on fork pull requests, which are precisely the
      # ones where outside code is being judged.
      #
      # `== 'failure'` rather than `!= 'success'`, and the difference is a
      # false statement. A skipped step has an outcome of '', which is not
      # 'success' — so the loose form fires when the checkout or the build
      # failed and the review never ran, and annotates the Checks tab with
      # "the review did not approve" about a review that did not happen. That
      # is the most visible surface in the whole workflow saying the one thing
      # this system exists to prevent.
      #
      # The `success() || failure()` guard is not redundant beside
      # `== 'failure'`, and deleting it as noise is the obvious mistake. Bare
      # `== 'failure'` carries an implicit success(), so a failing Publish
      # step would skip this one — the job still goes red, but the annotation
      # and the sentence explaining it vanish, and a consumer sees a red run
      # whose only red step is a `cat`. That is publishing changing what the
      # verdict says, which is the one thing the two steps are split apart to
      # prevent.
      - name: Take the verdict
        if: (success() || failure()) && steps.review.outcome == 'failure'
        run: |
          # The report's own heading already carries the distinction this
          # annotation must not throw away (see report.ts: every report opens
          # with "## Review: Approved", "## Review: Rejected" or
          # "## Review: Could not run"). Grepped rather than re-derived, so
          # this step can never say something the report itself does not.
          if [ -f "${RUNNER_TEMP}/review.md" ] && grep -q '^## Review: Could not run' "${RUNNER_TEMP}/review.md"; then
            echo "::error title=Review::The review could not run — nothing was reviewed. The report says why, in the job summary."
          else
            echo "::error title=Review::The review did not approve. The report is in the job summary."
          fi
          exit 1
