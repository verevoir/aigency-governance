# Infrastructure for the keyless review corpus (see infra/INSTALL.md).
#
# Pull requests: format and validate only, with NO cloud credentials.
# Push to main: PLAN as the read-only planner and print it; then, behind the
# `infra-apply` environment (operator-configured required reviewers), authenticate
# keylessly (GitHub OIDC -> Workload Identity Federation) as the deployer and
# apply exactly the plan it just made.
# Weekly and on demand: plan as the planner and FAIL on drift. Never applies.
# Remote state is required: the bucket and prefix come from repository
# VARIABLES and every job that touches cloud state fails if they are unset.
# Nothing here is a secret.
name: infra

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.x
      - name: Check formatting
        working-directory: infra
        run: tofu fmt -check -recursive
      - name: Initialise without a backend
        working-directory: infra/installations/verevoir
        run: tofu init -backend=false -input=false
      - name: Validate
        working-directory: infra/installations/verevoir
        run: tofu validate

  plan:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Require remote state
        run: |
          if [ -z "${TF_STATE_BUCKET}" ] || [ -z "${TF_STATE_PREFIX}" ]; then
            echo "TF_STATE_BUCKET and TF_STATE_PREFIX must be set as repository variables." >&2
            exit 1
          fi
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.INFRA_WIF_PROVIDER }}
          service_account: ${{ vars.INFRA_PLANNER_SA }}
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.x
      - name: Initialise
        working-directory: infra/installations/verevoir
        run: tofu init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="prefix=${TF_STATE_PREFIX}"
      - name: Plan
        working-directory: infra/installations/verevoir
        run: tofu plan -input=false -lock=false

  apply:
    if: github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: infra-apply
    permissions:
      contents: read
      id-token: write
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX }}
    # Two applies must never overlap; a queued one waits, it is not cancelled.
    concurrency:
      group: infra-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Require remote state
        run: |
          if [ -z "${TF_STATE_BUCKET}" ] || [ -z "${TF_STATE_PREFIX}" ]; then
            echo "TF_STATE_BUCKET and TF_STATE_PREFIX must be set as repository variables." >&2
            exit 1
          fi
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.INFRA_WIF_PROVIDER }}
          service_account: ${{ vars.INFRA_DEPLOYER_SA }}
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.x
      - name: Initialise
        working-directory: infra/installations/verevoir
        run: tofu init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="prefix=${TF_STATE_PREFIX}"
      - name: Plan
        working-directory: infra/installations/verevoir
        run: tofu plan -input=false -out=tfplan
      - name: Apply the plan above, and only that
        working-directory: infra/installations/verevoir
        run: tofu apply -input=false tfplan

  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Require remote state
        run: |
          if [ -z "${TF_STATE_BUCKET}" ] || [ -z "${TF_STATE_PREFIX}" ]; then
            echo "TF_STATE_BUCKET and TF_STATE_PREFIX must be set as repository variables." >&2
            exit 1
          fi
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.INFRA_WIF_PROVIDER }}
          service_account: ${{ vars.INFRA_PLANNER_SA }}
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.x
      - name: Initialise
        working-directory: infra/installations/verevoir
        run: tofu init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="prefix=${TF_STATE_PREFIX}"
      # Exit 0: no drift. Exit 1: error. Exit 2: the plan is not empty, i.e. the
      # real estate and the code have diverged. Both 1 and 2 fail this job.
      - name: Plan, failing on drift
        working-directory: infra/installations/verevoir
        run: tofu plan -input=false -lock=false -detailed-exitcode
