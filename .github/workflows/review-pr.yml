# What a consumer repository's copy of this file looks like — and this is one.
#
# Governance reviews its own pull requests through exactly the workflow every
# other repository will call. That is deliberate: an example that diverges
# from the thing it is an example of is the first place drift appears and the
# last place anyone looks.
name: review-pr

on:
  pull_request:

jobs:
  review:
    # A called workflow can't exceed its caller's grant, and review.yml needs
    # checks: read to list the PR's other checks.
    permissions:
      contents: read
      checks: read
    # The review definition is taken from main (the base), not from the pull
    # request's commit, so a PR cannot change the job that receives
    # GOVERNANCE_TOKEN. Gate configuration runs from the base, never the PR
    # head. Consequently a PR that changes review.yml is reviewed by main's
    # version, and its own review.yml changes take effect from the next PR
    # after merge. The shape tests in this repository still check review.yml
    # before merge.
    #
    # `@main` is deliberate here, because main IS the base for PRs to main.
    # It is unlike external callers, which should pin review.yml by commit
    # SHA (they still call `@main` until their pin PRs land).
    uses: verevoir/aigency-governance/.github/workflows/review.yml@main
    # No `governance-ref` is passed, and no PR-derived ref of any kind. The
    # new review.yml ignores that input, but until this change merges,
    # review.yml@main is the OLD workflow, which checks out and builds
    # governance at governance-ref with the secrets in the job. Passing no
    # PR-derived ref means even that old workflow builds main's runner, so PR
    # code never receives GOVERNANCE_TOKEN. review.yml still DECLARES the
    # input, for backward compatibility with other callers.
    #
    # Which JOB DEFINITION runs is decided by the `@main` above: GitHub reads
    # review.yml from main. The reviewer version it installs is whatever main
    # pins.
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      # Reads the private verevoir/aigency-guardrails corpus, so it needs
      # contents:read on that repository. The ambient GITHUB_TOKEN is scoped to
      # this repository alone and cannot do that, which is why GOVERNANCE_TOKEN
      # is passed here, as every other caller does. It must exist as a
      # repository secret on this private repository: on the GitHub Free plan,
      # organization secrets are not passed to private repositories.
      governance-token: ${{ secrets.GOVERNANCE_TOKEN }}
