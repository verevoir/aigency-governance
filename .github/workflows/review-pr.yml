# What a consumer repository's copy of this file looks like — and this is one.
#
# Governance reviews its own pull requests through exactly the workflow every
# other repository will call. That is deliberate: an example that diverges
# from the thing it is an example of is the first place drift appears and the
# last place anyone looks.
name: review-pr

on:
  pull_request:

jobs:
  review:
    # `./` rather than `verevoir/aigency-governance/...@main`, and the
    # difference has a real cost that is being accepted rather than missed.
    #
    # With a local path, GitHub runs the reusable workflow from the pull
    # request's OWN commit. So a change to the reviewer is tested by the pull
    # request that makes it, which is the only way a reviewer can ever be
    # improved safely — and it also means a pull request can modify the thing
    # that reviews it. For this repository that trade is right: the alternative
    # is a reviewer nobody can change without merging blind.
    #
    # The other five repositories will pin `@main` and will NOT have that
    # property, which is the correct asymmetry: they consume the reviewer, this
    # one develops it.
    uses: ./.github/workflows/review.yml
    # `governance-ref`, pinned to the pull request's own head commit rather
    # than left at the reusable workflow's default of `main`.
    #
    # The local `./` path above and this input fix two DIFFERENT halves of
    # self-review, and it is worth being explicit that they are separate,
    # because a reader who sees the local path will assume it covers
    # everything. The local path decides which JOB DEFINITION runs — with
    # it, GitHub reads review.yml from this pull request's own commit rather
    # than from main. It says nothing about what that job then does inside
    # itself. review.yml's second checkout step fetches the reviewer and the
    # lens set from `governance-ref`, and that input defaults to `main` —
    # so, unpinned, a self-review job whose DEFINITION came from this PR
    # would still build and run the RUNNER from main. On this branch main
    # has no `build` script, no `bin` entry and no `review/` directory, so
    # that second checkout's `npm run build` fails with "Missing script:
    # build" before a single lens runs — a pull request cannot be reviewed
    # by work that has not reached main yet, which is exactly the
    # bootstrap paradox this input closes.
    #
    # `github.event.pull_request.head.sha`, not `github.sha`. On a
    # `pull_request` event `github.sha` is the ephemeral merge commit GitHub
    # synthesises for the run — it is not a ref the second checkout, which
    # targets a *different* checkout of this same repository by `ref:`, can
    # be relied on to resolve consistently. `head.sha` is the real commit
    # the pull request is actually proposing, and is what must be reviewed.
    # Do not "simplify" this to `github.sha` — that is the obvious-looking
    # substitution and it is wrong for the reason above.
    #
    # Untested from here whether a `contents: read` token can fetch an
    # unmerged head sha by `ref:` at all, as opposed to needing
    # `refs/pull/N/head` — actions/checkout's behaviour with a fine-grained
    # token against an arbitrary sha on a PR branch is not something this
    # comment can verify by reading. If this input alone does not fix the
    # check, that is the next thing to try: change `ref:` on the second
    # checkout in review.yml to `refs/pull/${{ github.event.number }}/head`
    # (or pass it through as a second input) instead of a bare sha.
    #
    # THE TRADE THIS PIN MAKES, WRITTEN DOWN RATHER THAN LEFT IMPLICIT.
    #
    # What the exposure is: before this pin, the local `./` path above already
    # let a pull request control the JOB DEFINITION, but `governance-ref`
    # defaulting to `main` still meant the RUNNER BINARY — the code that
    # actually holds and calls ANTHROPIC_API_KEY — was built only from code
    # already on `main`. Pinning `governance-ref` to the PR's own head sha
    # removes that boundary: the code handling the API key is now also
    # whatever the pull request itself proposes.
    #
    # Why it is accepted, first argument: a repository that develops the
    # reviewer cannot review a change to the reviewer without running that
    # change — that is what self-review means, and it is the property this
    # file exists to have (see the `./` comment above). There is no version
    # of "review a change to the runner" that does not, at some point, run
    # the runner as changed.
    #
    # Why it is accepted, second argument, and the stronger one: the actual
    # size of the exposure, not just the necessity of accepting some
    # exposure. This workflow triggers on plain `pull_request:` (see the
    # `on:` block at the top of this file), not `pull_request_target` — the
    # trigger GitHub does NOT withhold repository secrets from, and the one
    # every guide to this problem warns against for exactly that reason.
    # This repository is also PRIVATE (confirmed by reading the repository's
    # own settings, not assumed): a private repository has no general
    # public-fork pathway the way a public one does, so there is no route
    # for an arbitrary outside contributor to open a pull request here at
    # all. Combined, every pull request this workflow will ever see comes
    # from someone who already has write access to this repository, or from
    # a fork GitHub only permits for someone already inside that boundary —
    # which is a materially smaller claim than "a contributor-authored diff
    # can reach the key": it is "a diff from someone who could reach the key
    # anyway, some other way, can reach the key". That is a bounded,
    # structural fact about this repository's visibility, not a hope about
    # who happens to send pull requests.
    #
    # THE RESIDUAL, NAMED HONESTLY AS AN OPEN ITEM AND NOT A MITIGATION:
    # nothing above is enforced by anything in this tree. "Private" and
    # "pull_request, not pull_request_target" are facts about how this
    # repository and this file are currently configured, not a check any
    # gate here runs or could run — a future change to either (making the
    # repository public, or switching the trigger) would silently widen the
    # exposure back to "any contributor-authored diff" with nothing here to
    # object. The enforcement that would close this — branch protection
    # requiring review on changes under .github/workflows/, or GitHub's own
    # fork-pull-request-approval setting — is a repository or organisation
    # SETTING, outside this tree entirely, and nobody has made it. That is
    # not a reason to reject this trade; it is the boundary of what a commit
    # to this repository can promise, stated rather than left for someone to
    # discover the day one of those two facts quietly changes.
    #
    # What would make the trade unacceptable, independent of the residual
    # above: this trade holds only as long as every pull request against
    # this repository comes from someone who already holds
    # ANTHROPIC_API_KEY — i.e. only from people already trusted with the
    # credential the exposure concerns. The moment this repository accepts a
    # pull request from outside that set — a public fork, an external
    # collaborator without the key, a policy change to who may open pull
    # requests here — the trade inverts: an untrusted change would be handed
    # a trusted secret to run itself with. That is the condition to watch
    # for, because it is the one most likely to be crossed without anyone
    # deciding to cross it.
    with:
      governance-ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      # The one case where the ambient token is enough: the repository being
      # checked out IS the repository running the job. Every other caller needs
      # a token that can see across, which is why the reusable workflow makes
      # this a required secret rather than an optional one — a default that
      # silently worked here and silently failed everywhere else is the defect
      # that was already found and fixed once.
      governance-token: ${{ secrets.GITHUB_TOKEN }}
