# What a consumer repository's copy of this file looks like — and this is one.
#
# Governance reviews its own pull requests through exactly the workflow every
# other repository will call. That is deliberate: an example that diverges
# from the thing it is an example of is the first place drift appears and the
# last place anyone looks.
name: review-pr

on:
  pull_request:

jobs:
  review:
    # `./` rather than `verevoir/aigency-governance/...@main`, and the
    # difference has a real cost that is being accepted rather than missed.
    #
    # With a local path, GitHub runs the reusable workflow from the pull
    # request's OWN commit. So a change to the reviewer is tested by the pull
    # request that makes it, which is the only way a reviewer can ever be
    # improved safely — and it also means a pull request can modify the thing
    # that reviews it. For this repository that trade is right: the alternative
    # is a reviewer nobody can change without merging blind.
    #
    # The other five repositories will pin `@main` and will NOT have that
    # property, which is the correct asymmetry: they consume the reviewer, this
    # one develops it.
    uses: ./.github/workflows/review.yml
    # `governance-ref`, still passed, and now UNUSED by review.yml.
    #
    # review.yml no longer checks out or builds governance. It installs the
    # published @verevoir/review, pinned exactly in review.yml itself, into
    # RUNNER_TEMP (outside the repository, with --ignore-scripts), and reads
    # the practices corpus from verevoir/aigency-guardrails (corpus/practices)
    # at its own `guardrails-ref` input, which defaults to main. So the
    # input below no longer selects a reviewer revision.
    #
    # It is kept because the interface is backward compatible: callers may
    # keep passing it, and removing it here would be a needless divergence
    # from the examples other repositories copy.
    #
    # What the local `./` path above still decides, and is the only thing
    # that makes self-review work: which JOB DEFINITION runs. GitHub reads
    # review.yml from this pull request's own commit, so a change to the
    # review workflow is exercised by the pull request that makes it. The
    # reviewer version it installs is whatever that commit pins.
    with:
      governance-ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      # Reads the private verevoir/aigency-guardrails corpus, so it needs
      # contents:read on that repository. The ambient GITHUB_TOKEN is scoped to
      # this repository alone and cannot do that, which is why the org secret
      # GOVERNANCE_TOKEN is passed here, as every other caller does.
      governance-token: ${{ secrets.GOVERNANCE_TOKEN }}
